<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow"></div>

<div class="wrap">
  <h1>Прогноз погоды</h1>
  <p class="subtitle">Данные из открытого источника, без регистрации и ключей</p>

  <form id="search-form">
    <input type="text" id="city-input" placeholder="Город, например Ростов-на-Дону" required autocomplete="off">
    <button type="submit">Найти</button>
  </form>
  <button class="geo-btn" id="geo-btn" type="button">📍 Определить по геолокации</button>

  <div id="status"></div>

  <div class="card" id="card">
    <div class="current">
      <div class="emoji" id="cur-emoji">☀️</div>
      <div class="current-info">
        <div class="temp" id="cur-temp">--°</div>
        <div class="place" id="cur-place"></div>
      </div>
    </div>
    <div class="meta">
      <span id="meta-wind"></span>
      <span class="dot">·</span>
      <span id="meta-desc"></span>
    </div>
    <div class="days" id="days"></div>
  </div>

  <footer>Данные: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></footer>
</div>

<script src="script.js" defer></script>
</body>
</html>
